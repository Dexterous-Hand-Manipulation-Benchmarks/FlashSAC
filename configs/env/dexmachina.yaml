# @package _global_
# The DexMachina training env has no camera (only eval_dexmachina.py builds one), so training records no videos.
num_record_episodes: 0

env:
  env_type: 'dexmachina'
  env_name: 'dexmachina/allegro_hand'

  # Link to root variables for FlashSAC math
  num_env_steps: ${num_env_steps}
  seed: ${seed}
  num_train_envs: ${num_train_envs}
  num_eval_envs: ${num_eval_envs}
  num_record_envs: ${num_record_envs}
  rescale_action: null
  max_episode_steps: null
  rl_device: 'cuda:0'

  # --- Dexmachina Specific Arguments ---
  hand: 'allegro_hand'
  clip: 's01_ketchup_01'
  retarget_name: 'para'
  # Curriculum length in epochs: train.py spreads them evenly over the run, and dexmachina zeroes the object
  # gains from epoch max_epochs - num_zero_epoch on.
  max_epochs: 10000
